# sporteka.cz — the whole weekly cycle on GitHub Actions (replaces Malina's bin/sporteka-import.sh + bin/sporteka-static.sh).
#   data: download the shop feeds → build the catalogue → incremental update of the catalogue mirror (no D1, nothing billed)
#   web:  render the changed pages from the mirror (local SSR, wrangler dev) → deploy them to the static shard Workers
#         sporteka-s00…s14 (Workers static assets, no script = free) → IndexNow → audit of the live site
# The site is static since 9. 11. 2026. Monday: data + web. Every other day: web only, and only when the previous run
# hit its time limit (marker data/state/web-pending) — rendering then continues where it stopped.
#
# PUBLIC repository: secrets only as step env (never job-wide, never echoed); state between runs is encrypted
# (scripts/state.sh, STATE_KEY); triggers are schedule + manual only (no pull_request); actions pinned to commits.
name: tyden
on:
  schedule:
    - cron: '0 0 * * 1'        # Monday 01:00 CET: data + web
    - cron: '30 3 * * *'       # daily 04:30 CET: continue the web part when it did not finish
  workflow_dispatch:
    inputs:
      data:
        description: 'Data: download feeds + build the catalogue'
        type: boolean
        default: false
      web:
        description: 'Web: render + deploy the changed pages'
        type: boolean
        default: true
concurrency:
  group: tyden
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  data:
    if: github.event.schedule == '0 0 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.data)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write          # release "state" (encrypted)
    env:
      SPT_ROOT: ${{ github.workspace }}/../spt-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret scan of the repository history (gitleaks, pinned + checksum)
        run: |
          curl -sSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: '3.13' }
      - name: Disk + swap (the build peaks around 5 GB of RAM)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile
          free -m; df -h . | tail -1
      - name: Restore state (encrypted)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/state.sh pull catalog
          scripts/state.sh pull feeds
          ls -l data
      - name: Credentials and feed list (from secrets, written outside the checkout, never printed)
        env:
          S1: ${{ secrets.SPT_CRED_SPORTEKA }}
          S2: ${{ secrets.SPT_CRED_AFFILIATEPORT }}
          S3: ${{ secrets.SPT_FEEDY_JSON }}
        run: |
          mkdir -p "$SPT_ROOT/credentials" "$SPT_ROOT/reports" data
          umask 077
          printf '%s\n' "$S1" > "$SPT_ROOT/credentials/.sporteka-credentials.env"
          printf '%s\n' "$S2" > "$SPT_ROOT/credentials/.affiliateport-credentials.env"
          printf '%s\n' "$S3" > data/feedy.json
      - name: Download feeds
        timeout-minutes: 150
        run: |
          python3 -I scripts/cj-stahni.py
          python3 -I scripts/decathlon-stahni.py
          python3 -I scripts/xml-feedy-stahni.py
          python3 -I scripts/cj-allegro.py
      - name: Gate (every enabled shop has a feed file)
        run: python3 -I scripts/feedy-kontrola.py
      - name: Build the catalogue
        env:
          SPT_MAX: '900000'
        run: python3 -I scripts/katalog.py build
      - name: Update the catalogue mirror (incremental, no D1 writes)
        env:
          SPT_PRODUCTION_APPROVED: 'yes'
          SPT_MIRROR_ONLY: 'yes'
          SPT_WEEK_WRITES: '50000000'
        run: python3 -I scripts/katalog.py update --env production
      - name: Save state (encrypted)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f data/feedy.json
          scripts/state.sh push catalog
          scripts/state.sh push feeds
      - name: Tell Kenny when it failed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "import sys,os; sys.path.insert(0,'scripts'); import staticky; staticky.discord('⚠️ sporteka: stažení feedů / katalog v GitHub Actions spadl — ' + os.environ['RUN'])"
      - name: Clean up credentials
        if: always()
        run: rm -rf "$SPT_ROOT/credentials" data/feedy.json

  web:
    needs: data
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped') && (github.event_name == 'schedule' || inputs.web)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write          # release "state" (encrypted)
    env:
      SPT_ROOT: ${{ github.workspace }}/../spt-root
      STATIC_PERSIST: /dev/shm/sporteka-render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Restore state (encrypted)
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/state.sh pull web
      - name: Anything to do?
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = '30 3 * * *' ] && [ ! -f data/state/web-pending ]; then
            echo "daily run: nothing pending"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the catalogue mirror (encrypted)
        if: steps.gate.outputs.go == 'true'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/state.sh pull catalog
          scripts/state.sh pull gsc
          test -f data/live-production.db
      - name: Disk
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          free -m; df -h . /dev/shm | tail -2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: steps.gate.outputs.go == 'true'
        with: { node-version: '22' }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.gate.outputs.go == 'true'
        with: { python-version: '3.13' }
      - name: Install (no secrets in this step)
        if: steps.gate.outputs.go == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Render + deploy the changed pages
        if: steps.gate.outputs.go == 'true'
        timeout-minutes: 320
        env:
          IMG_SECRET: ${{ secrets.IMG_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Search Console numbers come from Malina (data/gsc.json, encrypted state); no Google key here
          if [ -f data/gsc.json ]; then export GSC_FILE=data/gsc.json; fi
          # new pages stop starting after ~4.5 h (deploy of the current shard + state save must fit into the job)
          python3 -I scripts/staticky.py weekly --threads 4 --until "$(date -d '+270 minutes' +%H:%M)" 2>&1 | tee "$RUNNER_TEMP/weekly.log"
          rc=${PIPESTATUS[0]}
          mkdir -p data/state
          if grep -q 'deadline' "$RUNNER_TEMP/weekly.log"; then touch data/state/web-pending; else rm -f data/state/web-pending; fi
          exit $rc
      - name: Save state (encrypted)
        if: always() && steps.gate.outputs.go == 'true'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/state.sh push web
      - name: Secret check (repository + rendered pages left on disk)
        if: always() && steps.gate.outputs.go == 'true'
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          IMG_SECRET: ${{ secrets.IMG_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPT_CRED_SPORTEKA: ${{ secrets.SPT_CRED_SPORTEKA }}
          SPT_CRED_AFFILIATEPORT: ${{ secrets.SPT_CRED_AFFILIATEPORT }}
          SPT_FEEDY_JSON: ${{ secrets.SPT_FEEDY_JSON }}
        run: python3 -I scripts/verify_no_secrets.py --out
      - name: IndexNow
        if: steps.gate.outputs.go == 'true' && github.event.schedule == '0 0 * * 1'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/indexnow.py --limit 5000
          scripts/state.sh push web
      - name: Audit of the live site
        id: audit
        if: steps.gate.outputs.go == 'true' && hashFiles('data/state/web-pending') == ''
        continue-on-error: true
        run: python3 -I scripts/staticky_audit.py --sample 1000 --links 2000 2>&1 | tee "$RUNNER_TEMP/audit.log"; exit ${PIPESTATUS[0]}
      - name: Report
        if: always() && steps.gate.outputs.go == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB: ${{ job.status }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          { echo '### Render + deploy'; echo '```'; grep -E '^(s[0-9]+|main):|^sporteka-s|deadline|weekly done' "$RUNNER_TEMP/weekly.log" 2>/dev/null | tail -40; echo '```'
            echo '### Audit'; echo '```'; tail -25 "$RUNNER_TEMP/audit.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts'); import staticky
          job, audit, run = os.environ['JOB'], os.environ['AUDIT'], os.environ['RUN']
          pending = os.path.exists('data/state/web-pending')
          if job != 'success':
              staticky.discord(f'⚠️ sporteka: vykreslení / nasazení webu v GitHub Actions spadlo — {run}')
          elif audit == 'failure':
              staticky.discord(f'⚠️ sporteka: web nasazený, ale audit živého webu našel chyby — {run}')
          elif pending:
              print('not finished yet, continues tomorrow')
          elif os.environ.get('GITHUB_EVENT_NAME') == 'schedule':
              staticky.discord(f'✅ sporteka: týdenní aktualizace hotová, audit živého webu čistý — {run}')
          PY
